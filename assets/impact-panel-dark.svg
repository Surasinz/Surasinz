<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Engineering impact dashboard</title>
  <desc id="desc">Five metrics describing processing, data, interface, automation, and integration impact.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff35a2"/><stop offset="1" stop-color="#00f3ff"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="#0a0a0f"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <text x="34" y="42" fill="#8f94a0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2">MEASURED OUTPUT // PRODUCTION SIGNAL</text>
  <rect x="34" y="58" width="1132" height="2" fill="url(#line)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <g transform="translate(34 88)"><rect width="210" height="160" rx="10" fill="#111119" stroke="#292936"/><text x="18" y="62" fill="#ff35a2" font-size="42" font-weight="700">85%</text><text x="18" y="96" fill="#ffffff" font-size="13">LESS PROCESSING TIME</text><text x="18" y="127" fill="#777d89" font-size="11">TARGETED QUERY LOGIC</text></g>
    <g transform="translate(264 88)"><rect width="210" height="160" rx="10" fill="#111119" stroke="#292936"/><text x="18" y="62" fill="#00f3ff" font-size="42" font-weight="700">10K+</text><text x="18" y="96" fill="#ffffff" font-size="13">RECORDS / DAY</text><text x="18" y="127" fill="#777d89" font-size="11">SECURE DATA PIPELINE</text></g>
    <g transform="translate(494 88)"><rect width="210" height="160" rx="10" fill="#111119" stroke="#292936"/><text x="18" y="62" fill="#39ff14" font-size="42" font-weight="700">40%</text><text x="18" y="96" fill="#ffffff" font-size="13">FASTER UI LOAD</text><text x="18" y="127" fill="#777d89" font-size="11">APEX GRID OPTIMIZATION</text></g>
    <g transform="translate(724 88)"><rect width="210" height="160" rx="10" fill="#111119" stroke="#292936"/><text x="18" y="62" fill="#ff35a2" font-size="42" font-weight="700">40+</text><text x="18" y="96" fill="#ffffff" font-size="13">HOURS / MONTH</text><text x="18" y="127" fill="#777d89" font-size="11">WORKFLOW AUTOMATION</text></g>
    <g transform="translate(954 88)"><rect width="212" height="160" rx="10" fill="#111119" stroke="#292936"/><text x="18" y="62" fill="#00f3ff" font-size="42" font-weight="700">99.9%</text><text x="18" y="96" fill="#ffffff" font-size="13">PAYLOAD ACCURACY</text><text x="18" y="127" fill="#777d89" font-size="11">REAL-TIME INTEGRATION</text></g>
  </g>
