<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Surachet Panto — Enterprise Builder</title>
  <desc id="desc">Dark cyberpunk studio header for Surachet Panto, Software Engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset="0.58" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#11111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff35a2"/>
      <stop offset="1" stop-color="#00f3ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#ffffff" opacity=".025"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#scan)"/>
  <path d="M0 22Q0 0 22 0H1178Q1200 0 1200 22V338Q1200 360 1178 360H22Q0 360 0 338Z" fill="none" stroke="#ff35a2" stroke-opacity=".55"/>
  <path d="M36 58H178M36 58V126M1022 302H1164M1164 234V302" fill="none" stroke="#00f3ff" stroke-width="2"/>
  <rect x="50" y="42" width="10" height="10" rx="2" fill="#39ff14" filter="url(#glow)"/>
  <text x="76" y="52" fill="#9aa0aa" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">IDENTITY NODE // ONLINE</text>
  <text x="50" y="154" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">SURACHET</text>
  <text x="50" y="226" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">PANTO.</text>
  <text x="54" y="270" fill="#c8c9d0" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="5">SOFTWARE ENGINEER // ENTERPRISE BUILDER</text>
  <g transform="translate(880 70)">
    <rect width="270" height="184" rx="12" fill="#0f0f17" stroke="#2a2a38"/>
    <text x="24" y="38" fill="#ff35a2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">SYSTEM_PROFILE</text>
    <path d="M24 55H246" stroke="#2a2a38"/>
    <text x="24" y="88" fill="#8a8f99" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">FOCUS</text>
    <text x="100" y="88" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">ENTERPRISE</text>
    <text x="24" y="119" fill="#8a8f99" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">STACK</text>
    <text x="100" y="119" fill="#00f3ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">JAVA / SQL</text>
    <text x="24" y="150" fill="#8a8f99" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">BASE</text>
    <text x="100" y="150" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">NONTHABURI, TH</text>
  </g>
  <rect x="50" y="318" width="1100" height="2" fill="url(#accent)" opacity=".75"/>
</svg>
